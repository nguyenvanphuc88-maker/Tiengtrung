<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Học Tiếng Trung">
<meta name="theme-color" content="#fbf7f2">
<title>Học Tiếng Trung Cơ Bản</title>
<style>
:root{
  --bg:#fbf7f2; --card:#fff; --ink:#1f1a17; --muted:#7a6f66; --line:#ece4da;
  --red:#c8372d; --red-soft:#fbe9e6; --gold:#d9a441; --green:#2f8f5b; --green-soft:#e6f4ec;
  --t1:#d64545; --t2:#e09a2b; --t3:#2f8f5b; --t4:#3a6fd8; --t5:#8a8a8a;
  --r:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --han:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161311;--card:#211d1a;--ink:#f3ede7;--muted:#a59a90;--line:#332c27;--red-soft:#3a1f1c;--green-soft:#1b3326}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.han{font-family:var(--han)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
header.top h1{font-size:22px;margin:0;font-weight:700;flex:1;letter-spacing:-.2px}
.back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}
.back[hidden]{display:none}
main{padding:6px 16px 24px;max-width:640px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs button .ic{font-family:var(--han);font-size:22px;line-height:1}
nav.tabs button.on{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 4px 6px}
.hero{background:linear-gradient(135deg,#c8372d,#a32920);color:#fff;border:0;position:relative;overflow:hidden}
.hero .big{font-family:var(--han);font-size:64px;position:absolute;right:12px;top:-6px;opacity:.18;font-weight:700}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0;opacity:.9;font-size:14px;line-height:1.45}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:rgba(255,255,255,.15);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;opacity:.9}
.menu{display:grid;gap:10px}
.mi{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.mi .badge{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--han);font-size:24px;background:var(--red-soft);color:var(--red);flex:none}
.mi .tx{flex:1;min-width:0}
.mi .tx b{display:block;font-size:16px}
.mi .tx small{color:var(--muted);font-size:13px}
.mi .chev{color:var(--muted);font-size:20px}
.prog{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:3px}
.tone-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tone{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.tone svg{width:100%;height:34px}
.tone .py{font-size:20px;font-weight:700}
.tone .hz{font-family:var(--han);font-size:24px}
.tone small{display:block;font-size:11px;color:var(--muted)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;transition:transform .1s}
.cell:active{transform:scale(.95)}
.cell .py{font-size:20px;font-weight:700;color:var(--red)}
.cell .ex{font-size:12px;color:var(--muted);margin-top:2px}
.cell .ex .han{font-size:15px;color:var(--ink)}
.cell.playing{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.note{font-size:14px;line-height:1.55;color:var(--muted)}
.note b{color:var(--ink)}
.tip{background:var(--red-soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin:10px 0}
.word{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .hz{font-family:var(--han);font-size:30px;min-width:76px}
.word .info{flex:1}
.word .py{font-weight:600;color:var(--red)}
.word .vi{color:var(--muted);font-size:14px}
.spk{width:40px;height:40px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex:none}
.spk svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--red);color:#fff;font-weight:600;font-size:15px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.on{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.c{justify-content:center}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:8px 0 4px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* flashcard */
.fc-wrap{perspective:1200px;margin:14px 0}
.fc{position:relative;height:300px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.fc .back-f{transform:rotateY(180deg)}
.fc .hz{font-family:var(--han);font-size:84px;line-height:1.1}
.fc .py{font-size:26px;color:var(--red);font-weight:700;margin-top:6px}
.fc .vi{font-size:20px;margin-top:8px}
.fc .hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.counter{text-align:center;color:var(--muted);font-size:13px}
/* quiz */
.q-head{text-align:center;padding:18px 0 8px}
.q-head .hz{font-family:var(--han);font-size:64px}
.q-head .sub{color:var(--muted);font-size:14px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:17px;text-align:center;font-weight:500}
.opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt .han{font-size:26px}
.score{font-size:46px;font-weight:800;text-align:center;color:var(--red)}
.qbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.qbar i{display:block;height:100%;background:var(--red);transition:width .3s}
/* reading */
.sent{padding:14px 2px;border-bottom:1px solid var(--line)}
.sent:last-child{border-bottom:0}
.sent .line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 4px}
.sent ruby{font-family:var(--han);font-size:26px;ruby-position:over}
.sent rt{font-family:var(--font);font-size:12px;color:var(--red);font-weight:600}
.sent .punct{font-family:var(--han);font-size:26px}
.sent .vi{color:var(--muted);font-size:14px;margin-top:6px}
.sent .tools{display:flex;gap:8px;margin-top:8px}
.hide-py rt{visibility:hidden}
.hide-vi .sent .vi{filter:blur(6px)}
.hide-vi .sent .vi.show{filter:none}
.dlg-line{display:flex;gap:10px;align-items:flex-start}
.who{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:20px}
.who.a{background:var(--red)}.who.b{background:var(--t4)}
/* writing */
.chars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chars button{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:12px;font-family:var(--han);font-size:28px;position:relative}
.chars button.done::after{content:"✓";position:absolute;top:2px;right:5px;font-size:11px;color:var(--green);font-family:var(--font);font-weight:800}
.chars button.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.pad{position:relative;width:min(100%,340px);aspect-ratio:1;margin:8px auto;background:var(--card);border:2px solid var(--red);border-radius:6px;touch-action:none}
.pad svg.grid-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad #hw{position:absolute;inset:0}
.pad #hw svg{width:100%;height:100%}
.w-info{text-align:center;margin:6px 0}
.w-info .py{color:var(--red);font-weight:700;font-size:20px}
.w-info .vi{color:var(--muted);font-size:14px}
.w-msg{text-align:center;min-height:22px;font-size:14px;font-weight:600}
.w-msg.ok{color:var(--green)}.w-msg.bad{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);text-align:center;padding:20px}
.install{font-size:13px;line-height:1.5}
.install ol{margin:6px 0 0;padding-left:20px}
</style>
</head>
<body>
<header class="top" id="top">
  <button class="back" id="backBtn" hidden aria-label="Quay lại">‹</button>
  <h1 id="title">Học Tiếng Trung</h1>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="home" class="on"><span class="ic">家</span>Trang chủ</button>
  <button data-tab="pron"><span class="ic">音</span>Phát âm</button>
  <button data-tab="read"><span class="ic">读</span>Tập đọc</button>
  <button data-tab="write"><span class="ic">写</span>Tập viết</button>
</nav>
<div class="toast" id="toast"></div>

const store = {
  get(k,d){try{const v=localStorage.getItem("zh_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("zh_"+k,JSON.stringify(v))}catch(e){}}
};
let progress = store.get("progress",{quiz:{},written:{},tone:0,streakDay:null,streak:0});
function save(){store.set("progress",progress)}
(function streak(){
  const today=new Date().toDateString();
  if(progress.streakDay!==today){
    const y=new Date(Date.now()-864e5).toDateString();
    progress.streak = progress.streakDay===y ? progress.streak+1 : 1;
    progress.streakDay=today; save();
  }
})();

/* ================= SPEECH ================= */
let zhVoice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  zhVoice = vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/Tingting|Ting-Ting|Li-mu|Yu-shu/i.test(v.name))
         || vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let rate = store.get("rate",0.8);
function speak(text,el){
  if(!("speechSynthesis" in window)){toast("Thiết bị không hỗ trợ đọc giọng nói");return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN"; u.rate=rate; if(zhVoice)u.voice=zhVoice;
    if(el){el.classList.add("playing");u.onend=u.onerror=()=>el.classList.remove("playing");}
    speechSynthesis.speak(u);
  }catch(e){toast("Không phát được âm thanh")}
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function toneOf(py){const m={"ā":1,"ē":1,"ī":1,"ō":1,"ū":1,"ǖ":1,"á":2,"é":2,"í":2,"ó":2,"ú":2,"ǘ":2,"ǎ":3,"ě":3,"ǐ":3,"ǒ":3,"ǔ":3,"ǚ":3,"à":4,"è":4,"ì":4,"ò":4,"ù":4,"ǜ":4};for(const c of py)if(m[c])return m[c];return 5}
function colorPy(py){return py.split(" ").map(s=>`<span class="t${toneOf(s)}">${esc(s)}</span>`).join(" ")}

function push(fn){stack.push(fn);render()}
function pop(){stack.pop();render()}
let gen=0;
function render(){

    view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(answered)return; answered=true; const n=+b.dataset.n;
      if(n===t){score++;b.classList.add("ok")}else{b.classList.add("bad");view.querySelector(`.opt[data-n="${t}"]`).classList.add("ok")}

      $("#next").style.visibility="visible";
    });

  }
  q();
}

function Flash(l){
  setTitle("Thẻ ghi nhớ");
  let words=l.words.slice(), i=0, mode=store.get("fcmode","hz");
  function draw(){
    const w=words[i];
    const front = mode==="hz" ? `<div class="hz">${w[0]}</div>` : `<div class="vi" style="font-size:30px">${esc(w[2])}</div>`;
    view.innerHTML=`<div class="seg"><button data-m="hz" class="${mode==="hz"?"on":""}">Chữ Hán → nghĩa</button><button data-m="vi" class="${mode==="vi"?"on":""}">Nghĩa → chữ Hán</button></div>
    <div class="counter">${i+1} / ${words.length}</div>
    <div class="fc-wrap"><div class="fc" id="fc">
      <div class="face">${front}<div class="hint">Chạm để lật thẻ</div></div>
      <div class="face back-f"><div class="hz" style="font-size:64px">${w[0]}</div><div class="py">${colorPy(w[1])}</div><div class="vi">${esc(w[2])}</div></div>
    </div></div>
    <div class="row c"><button class="btn ghost" id="prev">‹ Trước</button><button class="spk" id="say" style="width:48px;height:48px">${SPK}</button><button class="btn ghost" id="shuf">🔀</button><button class="btn" id="nxt">Sau ›</button></div>`;
    const fc=$("#fc"); fc.onclick=()=>{fc.classList.toggle("flip"); if(fc.classList.contains("flip"))speak(w[0])};
    $("#say").onclick=()=>speak(w[0]);
    $("#prev").onclick=()=>{i=(i-1+words.length)%words.length;draw()};
    $("#nxt").onclick=()=>{i=(i+1)%words.length;draw()};
    $("#shuf").onclick=()=>{words=shuffle(words);i=0;draw();toast("Đã xáo trộn thẻ")};
    view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;store.set("fcmode",mode);draw()});
    // swipe
    let sx=null; fc.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
    fc.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){e.preventDefault();i=(i+(dx<0?1:-1)+words.length)%words.length;draw()}sx=null});
  }
  draw();
}
function Quiz(l){
  setTitle("Kiểm tra: "+l.name);
  const types=["hz2vi","vi2hz","listen"];
  const qs=shuffle(l.words).map(w=>({w,type:types[Math.random()*3|0]}));
  let i=0,score=0,wrong=[];
  function q(){
    if(i>=qs.length){
      save();
      view.innerHTML=`<div class="card" style="text-align:center"><div class="note">Kết quả</div><div class="score">${score}/${qs.length}</div>
      ${wrong.length?`<div class="note" style="text-align:left;margin:10px 0">Cần ôn lại:</div>${wrong.map(w=>`<div class="word"><div class="hz" style="font-size:24px;min-width:60px">${w[0]}</div><div class="info"><div class="py">${colorPy(w[1])}</div><div class="vi">${esc(w[2])}</div></div></div>`).join("")}`:`<p class="note">Hoàn hảo! 🎉</p>`}
      <div class="row c" style="margin-top:12px"><button class="btn" id="again">Làm lại</button><button class="btn ghost" id="bk">Xong</button></div></div>`;
      $("#again").onclick=()=>Quiz(l);$("#bk").onclick=pop;return}
    const {w,type}=qs[i];
    const pool=shuffle(allWords.filter(x=>x.hz!==w[0]&&x.vi!==w[2]));
    const distract=[...pool.filter(x=>x.lesson===l.id),...pool.filter(x=>x.lesson!==l.id)].slice(0,3);
    const opts=shuffle([{hz:w[0],py:w[1],vi:w[2],ok:1},...distract]);
    let head,label;
    if(type==="hz2vi"){head=`<div class="hz">${w[0]}</div><div class="sub">Từ này nghĩa là gì?</div>`;label=o=>esc(o.vi)}
    else if(type==="vi2hz"){head=`<div style="font-size:28px;font-weight:700">${esc(w[2])}</div><div class="sub">Chọn chữ Hán đúng</div>`;label=o=>`<span class="han">${o.hz}</span>`}
    else{head=`<button class="spk" id="play" style="width:80px;height:80px;margin:6px auto">${SPK.replace('<svg','<svg style="width:36px;height:36px"')}</button><div class="sub">Nghe và chọn từ đúng</div>`;label=o=>`<span class="han">${o.hz}</span> <small class="note">${o.py}</small>`}
    view.innerHTML=`<div class="qbar"><i style="width:${i*100/qs.length}%"></i></div><div class="counter">Câu ${i+1}/${qs.length}</div>
      <div class="q-head">${head}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${label(o)}</button>`).join("")}</div>
      <div class="w-info" id="fb" style="min-height:48px;margin-top:10px"></div>`;
    if(type==="listen"){$("#play").onclick=()=>speak(w[0]);const my=gen;setTimeout(()=>my===gen&&speak(w[0]),250)}
    let done=false;
    view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(done)return;done=true;const o=opts[b.dataset.k];
      if(o.ok){b.classList.add("ok");score++;progress.quiz[w[0]]=1}
      else{b.classList.add("bad");view.querySelectorAll(".opt").forEach((x,k)=>opts[k].ok&&x.classList.add("ok"));wrong.push(w);delete progress.quiz[w[0]]}
      $("#fb").innerHTML=`<span class="han" style="font-size:22px">${w[0]}</span> <span class="py">${colorPy(w[1])}</span> <span class="vi">— ${esc(w[2])}</span>`;
      speak(w[0]);
      const my=gen;setTimeout(()=>{if(my===gen){i++;q()}},o.ok?1100:2000);
    });
  }
  q();
}
function Reading(r){
  setTitle(r.name);
  let showPy=store.get("showPy",true), showVi=store.get("showVi",true);
  const plain=line=>line.map(t=>t[0]).join("");
  view.innerHTML=`<div class="row" style="margin:6px 0">
    <button class="btn sm ${showPy?"on":"ghost"}" id="tPy">Pinyin</button>
    <button class="btn sm ${showVi?"on":"ghost"}" id="tVi">Nghĩa</button>
    <button class="btn sm" id="all" style="margin-left:auto">▶ Đọc cả bài</button></div>
    <div class="tip">Mẹo luyện đọc: tắt <b>Pinyin</b> và <b>Nghĩa</b>, tự đọc to từng câu, rồi chạm 🔊 để so sánh với giọng mẫu.</div>
    <div class="card ${showPy?"":"hide-py"} ${showVi?"":"hide-vi"}" id="txt" style="padding:4px 14px">
    ${r.lines.map((ln,i)=>`<div class="sent"><div class="${r.dlg?"dlg-line":""}">${r.dlg?`<span class="who ${ln[0]==="A"?"a":"b"}">${ln[0]}</span>`:""}<div style="flex:1">
      <div class="line">${ln[1].map(t=>t[1]?`<ruby>${t[0]}<rt>${t[1]}</rt></ruby>`:`<span class="punct">${t[0]}</span>`).join("")}</div>
      <div class="vi" data-i="${i}">${esc(ln[2])}</div>
      <div class="tools"><button class="btn sm ghost" data-say="${i}">🔊 Nghe</button><button class="btn sm ghost" data-slow="${i}">🐢 Chậm</button></div>
    </div></div></div>`).join("")}</div>`;
  $("#tPy").onclick=()=>{showPy=!showPy;store.set("showPy",showPy);$("#txt").classList.toggle("hide-py",!showPy);$("#tPy").className="btn sm "+(showPy?"on":"ghost")};
  $("#tVi").onclick=()=>{showVi=!showVi;store.set("showVi",showVi);$("#txt").classList.toggle("hide-vi",!showVi);$("#tVi").className="btn sm "+(showVi?"on":"ghost")};
  view.querySelectorAll(".vi[data-i]").forEach(v=>v.onclick=()=>v.classList.toggle("show"));
  view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(plain(r.lines[b.dataset.say][1])));
  view.querySelectorAll("[data-slow]").forEach(b=>b.onclick=()=>{const o=rate;rate=0.5;speak(plain(r.lines[b.dataset.slow][1]));rate=o});
  $("#all").onclick=()=>speak(r.lines.map(l=>plain(l[1])).join(""));
}

/* ================= WRITING ================= */
let hw=null;
function hwCleanup(){if(hw){try{hw.cancelQuiz()}catch(e){}hw=null}}
const writeChars=(()=>{const seen=new Set(),out=[];
  for(const l of LESSONS){const arr=[];for(const w of l.words){const hz=[...w[0]];const pys=w[1].replace("'"," ").split(/\s+/);
    // tách pinyin theo âm tiết cho từ nhiều chữ
    let syl=[]; if(pys.length===hz.length) syl=pys; else syl=splitPy(w[1],hz.length);
    hz.forEach((c,k)=>{if(!seen.has(c)&&STROKES[c]){seen.add(c);arr.push({c,py:syl[k]||"",vi:hz.length===1?w[2]:`trong “${w[0]}” – ${w[2]}`})}})}
    out.push({name:l.name,chars:arr})}
  return out})();
function splitPy(py,n){
  const s=py.replace(/[\s']/g,"");const res=[];const re=/(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?[aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+(ng|n(?![aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ])|r(?![aeiouāáǎàēéěèīíǐìōóǒòūúǔù]))?/gi;let m;
  while((m=re.exec(s)))res.push(m[0]);return res.length===n?res:Array(n).fill("")}
function Write(){
  setTitle("Tập viết");
  const done=Object.keys(progress.written).length, total=writeChars.reduce((a,g)=>a+g.chars.length,0);
  view.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><b>Tiến độ</b><span class="note">${done}/${total} chữ</span></div><div class="prog"><i style="width:${done*100/total}%"></i></div>
    <div class="note" style="margin-top:10px">Quy tắc viết: <b>trên trước dưới sau, trái trước phải sau, ngang trước sổ sau, ngoài trước trong sau</b>.</div></div>
    ${writeChars.map(g=>`<div class="sec-title">${g.name}</div><div class="chars">${g.chars.map(x=>`<button class="${progress.written[x.c]?"done":""}" data-c="${x.c}">${x.c}</button>`).join("")}</div>`).join("")}`;
  view.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>push(()=>Writer(b.dataset.c)));
}
function Writer(c){
  const flat=writeChars.flatMap(g=>g.chars); let idx=flat.findIndex(x=>x.c===c); const item=flat[idx];
  setTitle("Viết: "+c);
  const nStrokes=STROKES[c].strokes.length;
  view.innerHTML=`<div class="w-info"><span class="han" style="font-size:22px">${c}</span> <span class="py">${colorPy(item.py)}</span> <button class="spk" id="say" style="display:inline-grid;vertical-align:middle;width:34px;height:34px;margin-left:6px">${SPK}</button><div class="vi">${esc(item.vi)} · ${nStrokes} nét</div></div>
  <div class="seg"><button data-m="watch" class="on">👀 Xem nét</button><button data-m="trace">✍️ Tô theo</button><button data-m="free">🧠 Tự viết</button></div>
  <div class="pad"><svg class="grid-bg" viewBox="0 0 100 100" preserveAspectRatio="none"><g stroke="#e8a59f" stroke-width=".4" stroke-dasharray="2 2"><line x1="0" y1="50" x2="100" y2="50"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></g></svg><div id="hw"></div></div>
  <div class="w-msg" id="msg"></div>
  <div class="row c" id="ctl"></div>
  <div class="row c" style="margin-top:14px"><button class="btn ghost sm" id="pv">‹ Chữ trước</button><button class="btn ghost sm" id="nx">Chữ sau ›</button></div>`;
  $("#say").onclick=()=>speak(c);
  $("#pv").onclick=()=>{stack[stack.length-1]=()=>Writer(flat[(idx-1+flat.length)%flat.length].c);render()};
  $("#nx").onclick=()=>{stack[stack.length-1]=()=>Writer(flat[(idx+1)%flat.length].c);render()};
  const size=Math.min($(".pad").clientWidth,340)-4;
  const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  hw=HanziWriter.create("hw",c,{
    width:size,height:size,padding:12,showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:250,
    strokeColor:dark?"#f3ede7":"#1f1a17",outlineColor:dark?"#3a332e":"#e6ddd3",radicalColor:"#c8372d",
    highlightColor:"#d9a441",drawingColor:"#c8372d",drawingWidth:22,showHintAfterMisses:2,
    charDataLoader:(ch,done)=>done(STROKES[ch])
  });
  const msg=$("#msg");
  function setMode(m){
    view.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
    try{hw.cancelQuiz()}catch(e){} msg.textContent="";msg.className="w-msg";
    const ctl=$("#ctl");
    if(m==="watch"){
      hw.showOutline();hw.showCharacter();
      ctl.innerHTML=`<button class="btn" id="anim">▶ Xem viết</button><button class="btn ghost" id="loop">🔁 Lặp lại</button><button class="btn ghost" id="step">Từng nét</button>`;
      let stepI=0,looping=false;
      $("#anim").onclick=()=>{looping=false;hw.animateCharacter()};
      $("#loop").onclick=()=>{looping=!looping;$("#loop").classList.toggle("on",looping);if(looping)hw.loopCharacterAnimation();else{hw.pauseAnimation();hw.showCharacter()}};
      $("#step").onclick=()=>{if(stepI===0)hw.hideCharacter();hw.animateStroke(stepI);msg.textContent=`Nét ${stepI+1}/${nStrokes}`;msg.className="w-msg";stepI=(stepI+1)%nStrokes;};
      setTimeout(()=>hw&&hw.animateCharacter(),300);
    }else{
      const free=m==="free";
      if(free)hw.hideOutline();else hw.showOutline();
      hw.hideCharacter();
      ctl.innerHTML=`<button class="btn ghost" id="redo">↺ Viết lại</button><button class="btn ghost" id="hint">💡 Gợi ý</button>`;
      let mistakes=0;
      const start=()=>{mistakes=0;msg.textContent=free?"Tự viết chữ theo trí nhớ, đúng thứ tự nét":"Dùng ngón tay tô theo nét mờ";msg.className="w-msg";
        hw.quiz({
          onMistake:s=>{mistakes++;msg.textContent=`Chưa đúng nét ${s.strokeNum+1} – thử lại nhé`;msg.className="w-msg bad"},
          onCorrectStroke:s=>{msg.textContent=`Đúng! Nét ${s.strokeNum+1}/${nStrokes}`;msg.className="w-msg ok"},
          onComplete:s=>{const good=s.totalMistakes<=Math.max(1,nStrokes/4|0);
            msg.textContent=good?`Tuyệt vời! 🎉 (${s.totalMistakes} lỗi)`:`Hoàn thành với ${s.totalMistakes} lỗi – luyện thêm nhé`;msg.className="w-msg "+(good?"ok":"bad");
            if(good){progress.written[c]=1;save()} speak(c);
            if(free) hw.showOutline();
          }
        })};
      $("#redo").onclick=start;
      $("#hint").onclick=()=>{hw.showOutline();toast("Đã hiện nét mờ")};
      start();
    }
  }
  view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  setMode("watch");
}

/* ================= START ================= */
const h=(location.hash||"").slice(1);
go(["home","pron","read","write"].includes(h)?h:"home");
